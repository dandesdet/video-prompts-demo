<style>
:root{--bg:#f6f6f4;--panel:#fff;--line:#e4e4e0;--line2:#d2d2cc;--text:#161616;--dim:#6d6d68;--accent:#FCCA2E;--ink:#161616;--cell:#fbfbfa;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#141414;--panel:#1c1c1c;--line:#2c2c2c;--line2:#3a3a3a;--text:#f2f2f0;--dim:#9a9a96;--cell:#181818}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
header{padding:28px 24px 18px}
h1{margin:0;font-size:26px;font-weight:700;letter-spacing:-.02em}
.sub{margin-top:4px;color:var(--dim);font-size:13px}
.brand{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--accent);margin-right:8px;vertical-align:1px}
.wrap{overflow-x:auto;padding:0 24px 48px}
table{border-collapse:separate;border-spacing:0;width:100%}
th{position:sticky;top:0;z-index:2;background:var(--bg);text-align:left;font-weight:600;font-size:12px;color:var(--dim);padding:8px 10px;border-bottom:1px solid var(--line2)}
td{vertical-align:top;padding:12px 10px;border-bottom:1px solid var(--line)}
.main{width:150px;height:150px;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:#fff}
.main img,.g img{width:100%;height:100%;object-fit:contain;cursor:zoom-in;display:block}
.link{max-width:220px}
.chip{display:inline-block;border:1px solid var(--line2);border-radius:6px;padding:2px 6px;color:var(--text);text-decoration:none;font-size:12px}
a.chip:hover{border-color:var(--accent)}
.host{color:var(--dim);font-size:12px;margin-left:6px}
.title{margin-top:8px;font-size:12px;color:var(--dim)}
.gal{display:grid;grid-template-columns:repeat(3,72px);gap:6px}
.g{position:relative;width:72px;height:72px;border-radius:8px;overflow:hidden;border:1px solid var(--line);background:#fff}
.g .n{position:absolute;left:3px;bottom:2px;font-size:10px;color:#555;background:rgba(255,255,255,.85);border-radius:4px;padding:0 3px}
.vid{position:relative;width:170px;height:226px;border-radius:10px;background:#000;isolation:isolate}
.vid video{width:100%;height:100%;object-fit:contain;display:block;border-radius:10px}
.vempty{width:170px;height:226px;border-radius:10px;border:1px dashed var(--line2);display:flex;align-items:center;justify-content:center;color:var(--dim);font-size:12px}
.ctl{position:absolute;bottom:6px;width:28px;height:28px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;padding:0;display:flex;align-items:center;justify-content:center}
.ctl:hover{background:rgba(0,0,0,.85)}
.ctl.on{background:var(--accent);color:var(--ink)}
.ctl svg{width:16px;height:16px}
.ctl.snd{left:6px}.ctl.pp{left:40px}.ctl.fs{right:6px}
.prompt{min-width:300px;max-width:420px}
.ptext{white-space:pre-wrap;font-size:13px;line-height:1.5;background:var(--cell);border:1px solid var(--line);border-radius:10px;padding:10px;max-height:226px;overflow:auto}
.pbar{margin-top:6px;font-size:12px}
.pbar button{border:0;background:none;padding:0;color:var(--dim);text-decoration:underline;text-underline-offset:2px}
.pbar button:hover{color:var(--text)}
.muted{color:var(--dim)}
.lb{position:fixed;inset:0;z-index:50;background:rgba(12,12,12,.96);display:none;perspective:1600px;overflow:hidden;user-select:none}
.lb.open{display:block}
.lb-stage{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;transform-style:preserve-3d}
.lb-item{position:absolute;transition:transform .5s cubic-bezier(.2,.75,.2,1),opacity .5s,filter .5s;cursor:pointer}
.lb-item img{width:100%;height:100%;object-fit:contain;background:#fff;border-radius:14px;box-shadow:0 40px 90px rgba(0,0,0,.55);display:block;-webkit-user-drag:none}
.lb-bar{position:absolute;left:0;right:0;bottom:calc(22px + env(safe-area-inset-bottom,0px));text-align:center;color:#f2f2f0;font-size:13px}
.lb-bar span{color:#9a9a96;margin-left:10px}
.lb-btn{position:absolute;width:44px;height:44px;border-radius:50%;border:0;background:rgba(255,255,255,.12);color:#fff;display:flex;align-items:center;justify-content:center;padding:0}
.lb-btn:hover{background:rgba(255,255,255,.22)}
.lb-btn svg{width:20px;height:20px}
.lb-close{top:calc(20px + env(safe-area-inset-top,0px));right:20px}.lb-prev{left:24px;top:50%;margin-top:-22px}.lb-next{right:24px;top:50%;margin-top:-22px}
@media (prefers-reduced-motion:reduce){.lb-item{transition:none}}
@media (max-width:900px){
  header{padding:20px 16px 10px}
  .wrap{padding:0 16px 40px}
  table,tbody,tr,td{display:block;width:100%}
  thead{display:none}
  tr{border:1px solid var(--line);border-radius:14px;background:var(--panel);padding:14px;margin-bottom:16px}
  td{border:0;padding:6px 0}
  td[data-l]::before{content:attr(data-l);display:block;font-size:11px;color:var(--dim);font-weight:600;margin-bottom:6px;text-transform:uppercase;letter-spacing:.03em}
  .link,.prompt{max-width:none;min-width:0}
  .main{width:100%;height:auto;aspect-ratio:1}
  .gal{grid-template-columns:repeat(3,1fr)}.g{width:auto;height:auto;aspect-ratio:1}
  .vid,.vempty{width:100%;height:auto;aspect-ratio:9/12}
  .lb-prev,.lb-next{display:none}
}
</style>
</head>

const DATA = {"rows": [{"url": "https://www.amazon.com/dp/B0BZ8FFPQL?ref=clp_hp_h_pc&th=1", "asin": "B0BZ8FFPQL", "host": "amazon.com", "title": "Valentino Uomo Born In Roma Intense for Men 3.4 oz Eau de Parfum Intense Spray", "main": "m0", "gallery": ["m1", "m2", "m3", "m4", "m5", "m6", "m7"], "video": "m8", "p1": "Generate a professional product character sheet and technical blueprint for cross-shot continuity.\n\nSubject: Valentino Uomo Born In Roma Intense, Eau de Parfum Intense, 100 ml. A rounded-shoulder flask-shaped glass bottle fully covered in a grid of raised pyramid Rockstud facets. The glass has a vertical three-zone gradient: opaque glossy black-burgundy at the top, deep saturated red in the middle band, and fully clear transparent crystal at the base. A horizontal black leather-grain label band sits across the front at mid-height. Topped with a tall matte black cylindrical cap resting on a matte black collar ring of oversized pyramid studs. All 4 views depict the exact same single product instance with identical colors, proportions, materials and details, rendered at consistent relative scale. Match the attached reference images precisely in every view.\n\nFormat: A single horizontal 16:9 layout on light gray paper (#DDDDDD). The central band contains 4 equal-width product views in one horizontal row, each isolated on a solid off-white backdrop (#EFEFEF). Product only in every view: no hands, props, packaging, second bottles or stray reflections.\n\nThe 4 views:\n1. \"3/4 L\": three-quarter view from the front left, showing the studded side profile, the rounded shoulders, the black-to-red-to-clear gradient wrapping around the side, and the label band at an angle\n2. \"HERO\": straight-on front elevation, cap, stud collar and label dead centre, the most iconic angle\n3. \"TOP\": direct bird's-eye view looking straight down on the cap, perfectly centred and symmetrical, showing the flat matte black circular cap top with a recessed inner ring and the debossed Valentino V-logo inside a circle at its centre, surrounded by the matte black pyramid-stud collar, with the rounded studded glossy black shoulders of the bottle visible around it\n4. \"MACRO\": extreme close-up of the front label band with the adjacent pyramid studs, filling the frame, showing the leather-grain texture and the pink lettering\n\nText accuracy is critical. The label is a matte black leather-grain band carrying only one word: \"VALENTINO\" in pink high-contrast Didone serif capitals, centred. No other text on the bottle. The cap top carries only the debossed V-logo in a circle, no lettering. Reproduce all wording exactly as written. Do not add, remove, translate or improvise any text.\n\nDocument chrome and labels:\n- Above each view, a clean bold monospace label matching its angle: \"3/4 L\", \"HERO\", \"TOP\", \"MACRO\".\n- Top margin header: \"BRAND: VALENTINO\" on the top-left, \"CHARACTER SHEET v1\" in the top-center, \"CATEGORY: EAU DE PARFUM INTENSE\" on the top-right.\n- Below the image row, four technical data blocks with generous spacing and zero text overlap:\n  1. \"COLOR PALETTE\": 4 swatches of the product's dominant colors, each labeled with a hex code: #141414, #5A0B1C, #C4213A, #E891BE.\n  2. \"MATERIALS\": small square texture swatches labeled \"STUDDED GRADIENT GLASS\", \"MATTE BLACK RESIN\", \"LEATHER-GRAIN LABEL\", \"CLEAR CRYSTAL BASE\", \"RED FRAGRANCE JUICE\".\n  3. \"DIMENSIONS (MM)\": HEIGHT, WIDTH, DEPTH, CAPACITY, with values \"-\", \"-\", \"-\", \"100 ML\".\n  4. \"MODEL CODE\": CODE, SKU, SEASON, DATE, values shown as \"-\" placeholders.\n\nAll printed text sharp, high contrast, correctly spelled, nothing truncated or overlapping.\n\nAesthetic and render quality: photorealistic high-end studio product photography, three-point softbox lighting for even illumination across all angles, controlled specular highlights on each stud facet, gentle rim light separating the silhouette from the backdrop, soft grounding shadows beneath each view, 100mm macro lens sharpness, ultra-high resolution, absolute clean line work and frame purity.", "p2": "Luxury fragrance campaign film, 15 seconds, vertical 9:16, 15 shots, hard cuts only, no transitions, no dissolves, no fades.\n\nPRODUCT LOCK. @sheet is the absolute visual truth. The product is Valentino Uomo Born In Roma Intense: a rounded-shoulder flask-shaped glass bottle fully covered in a grid of raised pyramid Rockstud facets. The glass has a vertical three-zone gradient: glossy opaque black at the top, deep saturated red juice in the middle band, fully clear crystal at the base. Topped with a tall matte black cylindrical cap resting on a matte black collar ring of oversized pyramid studs. Keep bottle proportions, stud grid, gradient zones, cap finish and label design identical in every shot.\n\nLABEL LOCK. The label is a horizontal rectangular band spanning the front of the bottle, sitting exactly where the black zone meets the red zone. It is matte black with a fine natural leather-grain texture, flat, no border frame, no bevel, no raised edges. It is wider than it is tall. It is not square, not glossy, not metallic.\n\nTEXT LOCK. The label carries exactly one word: \"VALENTINO\", spelled V-A-L-E-N-T-I-N-O, in pink high-contrast Didone serif capitals, centred on the band. The lettering is flat printed pink, flush with the surface, no 3D extrusion, no chrome, no glow, no drop shadow. No other text anywhere on the bottle. The cap top carries only a debossed Valentino V-logo in a circle, no lettering. Hold this spelling and layout stable and identical in every frame where the label is visible. Do not translate, abbreviate, restyle or invent any wording.\n\n[00:00.00] Extreme macro on the clear crystal base of the bottle, rows of transparent pyramid studs, no red juice in frame, cold desaturated monochrome, hard specular key raking across the stud facets against pure black. Camera drifts slowly downward along the stud rows.\n[00:01.08] Close-up on the label, framed straight-on and square to camera, the band filling roughly 70 percent of frame width, \"VALENTINO\" crisply legible, glossy black studs visible above and red studs below. Soft key from upper left, silver rim light on the stud edges. Camera pushes in very slowly.\n[00:02.40] Macro on the matte black pyramid-stud collar meeting the base of the cap and the glossy black studded shoulder below, grazing side light picking out every stud facet. Camera drifts laterally to the right.\n[00:03.03] Extreme macro inside the glass through the stud facets, refraction and caustics only, backlit specular, deep black falloff, cold and desaturated. Camera drifts fast and slides into defocus.\n[00:03.69] Macro on a fresh lavender spike, tiny closed buds filling frame, stem entering low, soft diffused cool daylight, low contrast, muted violet-grey. Camera pushes in slowly.\n[00:04.26] Macro on lavender stems running diagonally across frame, slight high angle, soft top light, violet with first warm edges creeping in. Camera zooms in slowly on the stems.\n[00:05.22] Macro on weathered Roman travertine stone, flat-on, porous surface and horizontal veins, deep shadow in the pores. Warm raking light sweeps across the stone from left to right as the camera tilts slowly upward.\n[00:06.63] Soft macro, dry vetiver roots tangled diagonally across frame, heavy bokeh, tilted frame, warm low-key from a single amber source, earthy brown and dusty gold. Camera drifts slowly on the diagonal.\n[00:07.62] Macro on a split dark vanilla pod, glossy black seeds exposed, slight high angle, directional warm key, crushed shadows, deep brown saturation. Camera drifts slowly along the pod.\n[00:08.73] Macro on the tip of a vanilla pod with thick dark resin-like extract running off it in slow strands, warm key from the left, wet specular highlights on the running liquid. Camera descends slowly following the drip.\n[00:09.87] Hold on the label, wider than the earlier label shot, showing the full band plus the black studded zone above and the glowing red studded zone below, both bottle edges in frame. \"VALENTINO\" remains sharp and legible. Warm key, red juice glowing through the studs. Camera pushes in slowly. This is a clean product shot, not an abstract.\n[00:11.13] Extreme macro of red juice refracting through the studded glass, molten and abstract, no label and no text in frame, Dutch-leaning tilt, backlit red core with silver edge specular. Camera drifts fast across frame with motion blur.\n[00:12.03] Bird's-eye view looking straight down on the cap, flat matte black cap top with a recessed ring and the debossed V-logo at its centre, surrounded by the matte black pyramid-stud collar and the glossy black studded shoulders, soft top key. Camera drifts slowly.\n[00:12.66] Medium hero, eye-level three-quarter front, the full bottle standing on a black reflective surface. The label band sits at the black-to-red boundary at correct scale, \"VALENTINO\" legible, cap and stud collar legible, black-red-clear gradient intact. Cool rim light separates the studded silhouette from the black void, warm core light inside the red juice. Camera rotates slowly with a gentle push in. Longest hold of the film.\n[00:14.28] Macro on lavender stems lying over a split vanilla pod with a sliver of travertine behind, warm low-key, heavy vignette closing the frame edges. Camera drifts slowly outward.\n\nCinematic, photorealistic, luxury fragrance campaign, Rome at night. Palette moves from cold desaturated silver and pure black, through muted lavender violet, into travertine gold, vetiver brown and dark vanilla, ending in near-black with deep red glow and a single pink accent from the label. No distortion. Maintain product proportions and the stud grid. Maintain label spelling and layout exactly. Keep the label a horizontal band. Steady motion, muted colors.", "source": "https://app.notion.com/p/How-to-Create-a-Luxury-Fragrance-Commercial-YSL-Tuxedo-3ac2d6d190a1810a89b4fdd833ac0471"}, {"url": "https://www.amazon.ae/PJ-PAUL-JONES-Textured-Pullover/dp/B0FC6M52N5/ref=sr_1_176?crid=3SQV7757R5QIU&dib=eyJ2IjoiMSJ9.rWSqXmwc3g2pdeDQKOAKPCwC-pTNNxPrujsgxG3OLgvVJ1sqwhTZq3AZxAcUh_zNLffoTYUxgBKZK0zW6KCJVmhKApYAEUF5IA1VzBjevsS0W5XxMpgtSdNch1hzuZB3deVeV3uT1uafVV3kbzurr9Vityaf1Nou7YcaUZp0SwahWRw1jxqRRpRtI2S60s0IDj2NrX0zxoB_txWXdZXoHSU-89lr3J_m0KZD5CqwlOuRyaOtTbhiVglz_mzTUZEoec2VM3LlonBcs4NX4yj86D4racGO6AD2TKmP5kak-hw.5Zjy8P9LwGnhQlcOItd5p6CQtDhzE31KTPje6vtkTyI&dib_tag=se&keywords=knitted%2Btop&qid=1790252989&sprefix=%2Caps%2C152&sr=8-176&xpid=n_cydjqSDBBYK&th=1&psc=1", "asin": "B0FC6M52N5", "host": "amazon.ae", "title": "PJ PAUL JONES Mens Quarter Zip Sweater Slim Fit Casual Pullover Sweater Mock Neck Textured Polo Sweater", "main": "m9", "gallery": ["m10", "m11", "m12", "m13", "m14"], "video": "", "p1": "", "p2": "", "source": "https://app.notion.com/p/How-to-Create-a-3D-360-Luxury-Apparel-Commercial-Ralph-Lauren-Polo-3d72d6d190a1814ab073d7b1514375a3"}, {"url": "https://www.amazon.com/Bulova-Mens-Marine-Star-98A226/dp/B07PGHH1JM/ref=sr_1_14?dib=eyJ2IjoiMSJ9.lJS8dF-4WpXK7mJr4UbxVjjUxooltsSLUjjB9QFQbmgjPgRHQxP3INhTRduRJy05eqPWE0n41o-ggc_7gserZCbPB4xdx82owKG0qQ9kREezuugaKpF1WllEwQyDf5f6EJc0ov_qlNqJ1j5a-sXKNAf2QqBhZTU5LG_FAOZF4H_9LpLyH5iPscVrIpvTrJ0hhrm3r5CVXJFSHoyGsYiS5HsuCchMDxvI7Rhi0RWucpcqTvOZCee4xNKJ3CU6SJwj9X_aOl-efkFwLIaCUdXHaOWHA75Y7Z10re8AqeluXoY.kXzecdb3HAZ5aB0pRpLOteR44RCDPyalXDLQZUoAW88&dib_tag=se&keywords=luxury+watches+for+men&qid=1790250170&sr=8-14", "asin": "B07PGHH1JM", "host": "amazon.com", "title": "Bulova Men's Marine Star 'Series A' Automatic Watch with Orange Silicone Strap Style: 98A226", "main": "m15", "gallery": ["m16", "m17", "m18"], "video": "m19", "p1": "Generate a professional product character sheet and technical blueprint for cross-shot continuity.\n\nSubject: Bulova Marine Star \"Series A\" Automatic, ref. 98A226, a 45mm stainless steel dive-style wristwatch with a silver-white dial featuring an open aperture at 7 o'clock revealing the automatic movement, alternating grey Roman numeral and baton hour markers, an orange minute track, a small seconds subdial, luminous silver-tone hands, a fixed steel bezel with a grey outer ring, a screw-down crown, and an orange textured silicone strap with a contrasting grey underside and steel tang buckle. All 5 views depict the exact same single product instance with identical colors, proportions, materials and details, rendered at consistent relative scale. Match the attached reference images precisely in every view.\n\nFormat: A single horizontal 16:9 layout on light gray paper (#DDDDDD). The central band contains 5 equal-width product views in one horizontal row, each isolated on a solid black backdrop (#000000). Product only in every view: no hands, props, packaging or stray reflections.\n\nThe 5 views:\n1. \"3/4 L\": three-quarter view from the front left, case angled to catch the light along the polished case flank and the grey bezel ring, orange strap curving away\n2. \"HERO\": straight-on frontal view of the dial, watch upright, orange strap extending above and below\n3. \"SIDE\": clean lateral profile showing the case flank, the screw-down crown, the thickness of the case and bezel, and the orange strap's grey underside\n4. \"BACK\": direct rear view showing the transparent exhibition caseback with the visible automatic movement and rotor, the steel caseback ring, and the grey underside of the strap with the steel tang buckle\n5. \"MACRO\": extreme close-up of the open aperture at 7 o'clock on the silver-white dial, showing the exposed balance wheel and movement parts, the aperture's edge, the adjacent Roman numeral marker and the orange minute track\n\nDocument chrome and labels:\n- Above each view, a clean bold monospace label matching its angle: \"3/4 L\", \"HERO\", \"SIDE\", \"BACK\", \"MACRO\".\n- Top margin header: \"BRAND: BULOVA\" on the top-left, \"CHARACTER SHEET v1\" in the top-center, \"CATEGORY: AUTOMATIC DIVE WATCH\" on the top-right.\n- Below the image row, four technical data blocks with generous spacing and zero text overlap:\n  1. \"COLOR PALETTE\": 4 swatches of the product's dominant colors, each labeled with a hex code: silver-white dial #E6E7E8, stainless steel #B5B8BB, bezel ring grey #5A5E62, strap orange #F26A1B.\n  2. \"MATERIALS\": small square texture swatches labeled \"STAINLESS STEEL\", \"TEXTURED SILICONE\", \"SILVER-WHITE DIAL\", \"MINERAL CRYSTAL\".\n  3. \"DIMENSIONS (MM)\": CASE DIAMETER 45, THICKNESS 13.45, STRAP WIDTH 24.\n  4. \"MODEL CODE\": CODE, SKU, SEASON, DATE, values shown as \"-\" placeholders.\n\nAll printed text sharp, high contrast, correctly spelled, nothing truncated or overlapping. Be literal about every text element on the dial, bezel and caseback: reproduce the Bulova logo, wordmark and all dial text exactly as they appear in the reference images, and do not improvise any wording.\n\nAesthetic and render quality: photorealistic high-end studio product photography, three-point softbox lighting for even illumination across all angles, gentle rim light separating the steel silhouette and orange strap from the black backdrop, soft grounding shadows where the backdrop tone allows, 100mm macro lens sharpness, ultra-high resolution, absolute clean line work and frame purity.\n\nHyper-detailed, photorealistic. Sport automatic dive watch editorial.", "p2": "", "source": ""}, {"url": "https://www.amazon.ae/adidas-Court-White-Women-Shoes/dp/B0CSDXFB75/ref=sr_1_8?crid=GZL1L6BIQ023&dib=eyJ2IjoiMSJ9.-AYz9BMbr5DfDZ-Go4R5fhqrS1UW1VLapKP0HqRPZV7pf6kBYp7hxE3jHg6B6n1h6bTwUxo-x6NJieKj49vZ4Gatjzmhz3dhYarb6YMtJ07tFIS7i2sgjdmauVgnrJS7YcCLxovSSZX3ssc60M3K-CrbGPhstlvoWRsaodFMEVvdIH6CLwSJiT95V46j8ZxeWhoPZPb4irnBclJ969FWZ3fvXcI4S-BdXiwmF3zFT1w71hRxGI8K9C4Y4ky26OWwYjWx7WKARuhLdenAFlPw2EuFiEb-D8mwNAWJIn7Ilqo.w2a4N-tXiDrmQJRXURNxxmvdWij0BgfAVMszw8Xk72A&dib_tag=se&keywords=sneakers&qid=1790245956&sprefix=sneakers%2Caps%2C165&sr=8-8&th=1&psc=1", "asin": "B0CSDXFB75", "host": "amazon.ae", "title": "adidas VL COURT BASE SHOES womens SHOES - LOW (NON FOOTBALL)", "main": "m20", "gallery": ["m21", "m22", "m23"], "video": "m24", "p1": "You are a luxury product video director writing Seedance 2.5 prompts.\n\nINPUT\nI will attach one or more images of a single pair of shoes. Study them\ncarefully before writing anything.\n\nSTEP 1 - PRODUCT READ (output as a short bullet list, max 8 lines)\nFrom the images, identify:\n- Shoe type and silhouette (sneaker, loafer, heel, boot, etc.)\n- Exact colorway, including tonal variations and any contrast panels\n- Upper material and finish (smooth calfskin, suede, patent, knit,\n  canvas, exotic, matte vs glossy)\n- Signature brand detail: logo, emblem, monogram, plaque, buckle,\n  stripe, or heel tab. This is the hook of the video.\n- Secondary details worth a macro shot: stitching, perforations,\n  broguing, eyelets, laces, welt, hardware finish\n- Sole and midsole construction, tread pattern, edge paint, heel shape\n- Any asymmetry or a side that reads best on camera\n\nIf a detail is not visible in the images, say so and do not invent it.\n\nSTEP 2 - SHOT PLAN (output as a table: Shot | Timestamp | Description)\nFormat is locked: 15 seconds, 6 shots, 2.5 seconds each, hard jump\ncuts only, no transitions, no text overlays.\n\nSetting is locked for every shot: a seamless pure white studio\ncyclorama, infinity cove, no visible horizon line, no props, no\nfurniture, no hands, no people, no background objects. The shoe rests\non or floats above a clean white surface. Only soft grounded contact\nshadow and gentle gradient falloff are allowed.\n\nThe 6 beats:\n1. HOOK. Extreme macro push-in on the signature brand detail, frame\n   filled edge to edge, hard raking key light catching the material or\n   hardware.\n2. SILHOUETTE. Full side profile, medium shot, shoe upright on white,\n   camera arcs slowly across it to reveal the complete outline.\n3. TEXTURE. Extreme macro on the upper material and stitching, side\n   raking light carving out grain and thread ridges, camera near static\n   with a micro drift.\n4. TOP-DOWN. Bird's eye view, shoe flat on white, laces or straps\n   arranged deliberately, soft even overhead light, slow zoom out.\n5. UNDERSIDE. Low angle from below or the shoe slowly rotating in\n   mid-air, revealing the outsole tread and midsole stack, dramatic\n   under-lighting with a crisp rim edge.\n6. HERO. Definitive three-quarter beauty shot at eye level, centered on\n   white, soft-box key with subtle rim separation, static hold with an\n   ultra-slow push-in.\n\nBefore you present the table, silently check that every shot differs\nfrom every other shot across at least 3 of these 5 dimensions: camera\nangle, subject distance, focus element, camera movement, lighting mood.\nReplace any shot that fails this check.\n\nSTEP 3 - SEEDANCE 2.5 PROMPT\nOutput a settings line, then the prompt inside a code block.\n\nSettings: Model: Seedance 2.5 | Quality: 1080p | Aspect ratio: 9:16 |\nRuntime: 15s | 6 shots, jump cuts only\nAttach: the product images as @Image1 (and @Image2 etc. if multiple).\n\nThe prompt must follow this exact skeleton:\n\n  Opening line: product category campaign video, 15 seconds, 6 shots,\n  hard jump cuts only, no transitions. Then one sentence naming the\n  product with its real materials and colorway, referenced via @Image1.\n  Then a consistency lock: keep the product design, colorway, material\n  finish, and hardware identical across every shot. Then: clean pure\n  white seamless studio background throughout, no props, no people.\n\n  Six timestamped blocks: [00:00] [00:02.5] [00:05] [00:07.5] [00:10]\n  [00:12.5]. Each block states which reference image or panel to use,\n  the framing, the subject and what is in focus, the lighting setup, and\n  one primary camera movement. Present tense. One movement per shot.\n\n  Closing style anchor: cinematic, photorealistic, high-end footwear\n  campaign, minimalist studio product cinematography, shot on a macro\n  prime lens, shallow depth of field, high-key lighting, pure white\n  background, [the product's real colors]. No distortion. Maintain\n  product proportions, stitching count, and logo placement throughout.\n  Steady motion, clean color grade, no text, no watermark.\n\nWRITING RULES\n- Describe what IS in frame, never what is absent, except for the\n  explicit background and constraint locks above.\n- Every camera move gets a degree adverb: slowly, gently, ultra-slowly.\n- Use real photographic vocabulary: raking light, soft-box key, rim\n  light, macro prime, shallow depth of field, contact shadow.\n- Name materials precisely. Not \"leather\" but \"polished black calfskin\".\n- Keep the prompt body between 180 and 280 words.\n- Do not add music, voiceover, captions, or logos as text.\n\nThen give me a 3 line note on which shot is most likely to fail and what\nto change first if it does.\n\nWait for my images before producing anything.", "p2": "Sneaker campaign video, 15 seconds, 6 shots, hard jump cuts only, no transitions. The product is the low-top court sneaker from @Image1: smooth white leather upper, three matte black stripes, off-white suede toe cap, white flat laces, black adidas wordmark on the tongue, dark brown gum rubber cupsole. Keep the product design, colorway, material finish, and hardware identical across every shot. Clean pure white seamless studio background throughout, no props, no people.\n\n[00:00] Reference @Image4. Extreme macro on the three black stripes, stripe edges and stitching filling the frame. Hard raking key from the left. Camera slowly pushes in.\n\n[00:02.5] Reference @Image4. Medium lateral profile, sneaker upright on white, soft contact shadow, full outline sharp. Soft-box key from above. Camera gently arcs from toe to heel.\n\n[00:05] Reference @Image1. Extreme macro on the seam where the off-white suede toe cap meets the smooth upper, suede nap and stitch line in focus. Low side raking light. Camera ultra-slowly drifts right.\n\n[00:07.5] Reference @Image2. Bird's-eye view, sneaker flat on white, laces neatly tied, tongue wordmark centered. Soft even overhead light. Camera slowly zooms out.\n\n[00:10] Reference @Image3. Low angle from below, sneaker gently rotating in mid-air, gum cupsole sidewall and heel tread in focus. Dramatic under-lighting with crisp rim edge. Camera stays locked.\n\n[00:12.5] Reference @Image1. Three-quarter beauty shot at eye level, sneaker centered on white. Soft-box key with subtle rim separation. Static hold, ultra-slow push-in.\n\nCinematic, photorealistic, high-end footwear campaign, minimalist studio product cinematography, shot on a macro prime lens, shallow depth of field, high-key lighting, pure white background, white, black and gum brown palette. No distortion. Maintain product proportions, stitching count, and logo placement throughout. Steady motion, clean color grade, no text, no watermark.", "source": "https://app.notion.com/p/White-Studio-Shoe-Reel-Master-Prompt-Guide-3bb2d6d190a181d59b0bc58ed44f6a83"}, {"url": "https://www.amazon.ae/Rosefinch-Professional-Ballroom-Practice-Performance/dp/B09PBRLD3D/ref=sr_1_18?_encoding=UTF8&content-id=amzn1.sym.b9d08113-948b-4720-9fee-4236c88627ce&dib=eyJ2IjoiMSJ9.SG0YM1Kh7KyZosc1b_Tr1Y3TATHLWv0-FHDSRwyXmDslTkC8iMH7Xmqv09SddBvdzgQsWOCpSQ9ajsLcpXTkyr6E7A5hg84nUD9JQ_-iAS6HpTU0-ON-0iHVT2dhReL5NQbJsZzt7iv0hYnD3HyfiesBkhA6VkJZvdE9lYOPYSfd1mlJXD5gs0gLf3hXV2v6qF7NzwnGRglnLCOEfr3xLQ9C38gvE0Y9EUt8elVW5QZOlVZOPMKcfS6m7-r_X1-xy82DBZTYhPdUGMALoM8iG09uGOC03IogTYMsVfEnM10.0nW44PP-2dNUv23g8X3_4BRD6RUs677ar6qrMppao1A&dib_tag=se&pd_rd_r=127b7f16-d731-4667-9a96-ff7c167236d9&pd_rd_w=LFvLO&pd_rd_wg=TdrhC&qid=1790229698&refinements=p_n_prime_domestic%3A20642115031%7C20642116031&rnid=20642114031&s=apparel&sr=1-18&th=1&psc=1", "asin": "B09PBRLD3D", "host": "amazon.ae", "title": "Rosefinch Women's", "main": "m25", "gallery": ["m26", "m27", "m28", "m29", "m30", "m31", "m32", "m33", "m34"], "video": "", "p1": "", $("#lb").addEventListener("click", e => { if (e.target.id === "lb" || e.target.id === "lbStage") closeLB(); });
document.addEventListener("keydown", e => { if (!$("#lb").classList.contains("open")) return; if (e.key === "Escape") closeLB(); else if (e.key === "ArrowLeft") go(LB.cur - 1); else if (e.key === "ArrowRight") go(LB.cur + 1); });
let wl = 0; $("#lb").addEventListener("wheel", e => { e.preventDefault(); const d = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY; if (Math.abs(d) < 8 || Date.now() < wl) return; wl = Date.now() + 280; go(LB.cur + Math.sign(d)); }, { passive: false });
let tx = null; $("#lb").addEventListener("touchstart", e => { tx = e.touches[0].clientX; }, { passive: true });
$("#lb").addEventListener("touchend", e => { if (tx == null) return; const dx = e.changedTouches[0].clientX - tx; if (Math.abs(dx) > 40) go(LB.cur - Math.sign(dx)); tx = null; });
addEventListener("resize", () => { if ($("#lb").classList.contains("open")) layout(); });
</script>
</body>
</html>
